[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.create-portal]
verify_jwt = true

[auth]
site_url = "https://potlakai.github.io/nus/"
additional_redirect_urls = ["nus-desktop://auth/callback", "https://potlakai.github.io/nus/pro.html", "https://potlakai.github.io/nus/success.html", "http://localhost:8126/pro.html"]

# `supabase config push` manages the WHOLE auth section: anything not listed
# here is reset to the CLI default. These are the project's real values.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
