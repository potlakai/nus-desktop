[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.create-portal]
verify_jwt = true

# Anonymous usage stats (TELEMETRY-CONTRACT.md). Installs have no Supabase
# user, so the gateway does not require a JWT: `track` validates and
# rate-limits on its own, `daily-metrics` and `install-ledger` are guarded by
# METRICS_TOKEN.
[functions.track]
verify_jwt = false

[functions.daily-metrics]
verify_jwt = false

[functions.install-ledger]
verify_jwt = false

[auth]
site_url = "https://potlakai.github.io/nus/"
additional_redirect_urls = ["nus-desktop://auth/callback", "https://potlakai.github.io/nus/pro.html", "https://potlakai.github.io/nus/success.html", "http://localhost:8126/pro.html"]

# `supabase config push` manages the WHOLE auth section: anything not listed
# here is reset to the CLI default. These are the project's real values.
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true


# Click-to-install bridge (2026-10-15). The site beacons download-button clicks
# here; no user, no JWT.
[functions.click]
verify_jwt = false

# Optional Google account for the Companion (docs/accounts-b.md, 2026-11-02).
# Both take the signed-in user JWT: the gateway verifies it.
[functions.link-install]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
